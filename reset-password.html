<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>EHS-IQ · Reset password</title>
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="/assets/smartiq-mark.png" alt="" width="56" height="56">
      <div>
        <p class="brand-lg">EHS-<span>IQ</span></p>
        <p class="muted">Elderly Homeowner Support · SmartIQ Realty</p>
      </div>
    </div>
    <h1>Set a new password</h1>
    <p class="muted" id="subtext">Enter and confirm your new password.</p>
    <p id="message-box" role="alert" hidden></p>

    <form id="reset-form">
      <label>New password
        <input type="password" id="password" autocomplete="new-password" required minlength="10">
      </label>
      <label>Confirm password
        <input type="password" id="confirm" autocomplete="new-password" required minlength="10">
      </label>
      <button type="submit" id="submit-btn">Update password</button>
    </form>
  </main>

  <script type="module">
    // Same flow as HomeAccessIQ's reset page: wait for Supabase's
    // PASSWORD_RECOVERY session, update the password, sign out the
    // temporary session, then send the agent to a clean sign-in.
    import { supabaseClient } from '/js/supabaseClient.js';

    const form = document.getElementById('reset-form');
    const msgBox = document.getElementById('message-box');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      msgBox.textContent = text;
      msgBox.className = type === 'error' ? 'error-banner' : 'success-banner';
      msgBox.hidden = false;
    }

    let recoveryReady = false;
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
    });
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) recoveryReady = true;

    if (!recoveryReady) {
      showMessage('This reset link is invalid or has expired. Send a new one from the Supabase dashboard.', 'error');
      form.hidden = true;
      document.getElementById('subtext').hidden = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirm').value) {
        showMessage('Passwords do not match.', 'error');
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        showMessage(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update password';
        return;
      }
      showMessage('Password updated. Taking you to sign in...', 'success');
      form.hidden = true;
      await supabaseClient.auth.signOut();
      setTimeout(() => window.location.replace('/login.html'), 1800);
    });
  </script>
</body>
</html>
